<!doctype html>
<!-- The digest modules outside the site: tiktok-clips/tools/digest-race.js and digest-test.mjs open this page in
     headless Chrome from a local server that maps /digest/ to this folder and /mediabunny.mjs to the npm bundle. -->
<html><head><meta charset="utf-8"><title>digest runner</title>
<script type="importmap">{ "imports": { "mediabunny": "/mediabunny.mjs" } }</script>
</head><body style="margin:0;background:#000">
<input type="file" id="file">
<script type="module">
import { digestModel, factsFromEvents, factsFromLive, FPS } from './model.js';
import { renderer, W, H } from './draw.js';
import { buildDigest, probe } from './build.js';

const facts = (d) => (d.lines ? factsFromLive(d.lines) : factsFromEvents(d.events, d));

// overlay frames at clip seconds vs, as PNG data URLs (transparent background)
window.renderFrames = (d, vs) => {
    const cv = document.createElement('canvas');
    cv.width = W; cv.height = H;
    const ctx = cv.getContext('2d');
    const draw = renderer(ctx, digestModel(facts(d), { stream: d.duration }));
    return vs.map((v) => { ctx.clearRect(0, 0, W, H); draw(v); return cv.toDataURL('image/png'); });
};

// the whole clip from the file chosen in #file; the result stays in window.__clip for chunk()
window.build = async (d) => {
    const file = document.getElementById('file').files[0];
    const t0 = performance.now();
    const info = await probe(file);
    const f = facts(d);
    if (d.date) f.date = d.date;
    const model = digestModel(f, { stream: info.duration, video: d.video, slow: d.slow });
    let heap = 0;
    const sample = () => { heap = Math.max(heap, performance.memory?.usedJSHeapSize || 0); };
    const timer = setInterval(sample, 500);
    const clip = await buildDigest({ file, model, onProgress: (p) => { window.__progress = p; sample(); } });
    clearInterval(timer);
    window.__clip = clip;
    const people = Object.values(model.people);
    return {
        ms: Math.round(performance.now() - t0), lost: window.__progress.lost, size: clip.size, heapMB: Math.round(heap / 1048576),
        stream: info.duration, codec: info.codec, frames: Math.round(model.video * FPS), speed: model.speed,
        wins: model.wins.length, players: people.length, names: people.map((p) => p.name),
    };
};

window.chunk = async (from, size) => {
    const b = new Uint8Array(await window.__clip.slice(from, from + size).arrayBuffer());
    let s = '';
    for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000));
    return btoa(s);
};
window.ready = true;
</script></body></html>
