<!doctype html>
<!-- The development digest generator: opened in the owner's Chrome (with the LIVE Center extension) from the
     local server of tiktok-clips/tools/dev-digest.js, which maps /DevDigest/ and /Digest/ to these folders,
     /mediabunny.mjs to the npm bundle and /data/dev-log.json to tiktok-clips/docs/dev-digest/dev-log.json. -->
<html lang="ru"><head><meta charset="utf-8"><title>Дайджест разработки</title>
<script type="importmap">{ "imports": { "mediabunny": "/mediabunny.mjs" } }</script>
<style>
  body { margin: 0; background: #0e0f13; color: #e8eaf0; font: 15px/1.5 system-ui, sans-serif; }
  .wrap { display: flex; gap: 20px; padding: 16px; flex-wrap: wrap; }
  canvas { height: min(84vh, 960px); aspect-ratio: 9/16; background: #000; border: 1px solid #2a2f3a; border-radius: 8px; }
  .side { flex: 1 1 360px; max-width: 560px; }
  button, select { background: #171a21; color: #e8eaf0; border: 1px solid #2a2f3a; border-radius: 6px; padding: 6px 12px; font: inherit; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  #status { white-space: pre-wrap; font-variant-numeric: tabular-nums; color: #c9cede; margin-top: 10px; }
  table { border-collapse: collapse; font-size: 13px; margin-top: 10px; }
  td { padding: 2px 8px 2px 0; }
  .ok { color: #7ee787; } .no { color: #ff7b72; }
</style></head>
<body><div class="wrap">
  <canvas id="v" width="1080" height="1920"></canvas>
  <div class="side">
    <h2 style="margin:0 0 8px">Дайджест разработки</h2>
    <div>
      <label>Собрать <select id="len"><option value="600">всё (10 мин, по частям с докачкой)</option><option value="90">первые 90 с (проба)</option><option value="200">1:50–3:20 (шарики, самолёты)</option></select></label>
      <button id="check">1. Найти записи в LIVE Center</button>
      <button id="build" disabled>2. Собрать MP4</button>
      <button id="test">Проба без записей</button>
      <button id="stop" disabled>Стоп</button>
    </div>
    <div id="status">Загружаю данные…</div>
    <table id="recs"></table>
  </div>
</div>
<script type="module">
import { buildDevDigest, recordings } from './build.js';
import { parts, schedule } from './schedule.js';
import { extension, useStore } from '../Digest/livecenter.js';

// what is read from LIVE Center stays on disk (tiktok-clips/work/dev-digest-cache): reruns read it from there
useStore({
    get: async (key) => { const r = await fetch(`/store?key=${encodeURIComponent(key)}`); return r.ok ? new Uint8Array(await r.arrayBuffer()) : null; },
    put: (key, bytes) => fetch(`/store?key=${encodeURIComponent(key)}`, { method: 'POST', body: bytes }),
});

const $ = (id) => document.getElementById(id);
const data = await (await fetch('/data/dev-log.json', { cache: 'no-store' })).json();
let hlsOf = null, ctrl = null;
const say = (s) => { $('status').textContent = s; };
say(`Строк: ${data.lines.length}, анимаций: ${Object.keys(data.heroes).length}, записей: ${Object.keys(data.streams).length}.\n` +
    (extension() ? `Расширение ${extension()} на месте.` : 'Расширение не видно: перезагрузите его в chrome://extensions (нужна версия 0.2.0) и обновите страницу.'));

$('check').onclick = async () => {
    $('check').disabled = true;
    const list = Object.keys(data.streams);
    $('recs').innerHTML = list.map((id) => `<tr><td>${id}</td><td id="r-${id}">…</td></tr>`).join('');
    say('Ищу записи (LIVE Center откроется в фоновой вкладке, если нужно)…');
    hlsOf = await recordings(data, list, (id, ok) => { $(`r-${id}`).innerHTML = ok ? '<span class="ok">есть</span>' : '<span class="no">нет</span>'; });
    const miss = list.filter((id) => !hlsOf[id]);
    say(miss.length ? `Не найдено ${miss.length} из ${list.length}: их куски будут повтором предыдущего кадра.` : `Все ${list.length} записей найдены.`);
    $('build').disabled = false; $('check').disabled = false;
};

// one piece of the video to the local server, piece by piece: tiktok-clips/out/dev-digest/<name>
async function piece(name, range, onProgress) {
    const post = (pos, body, first) => fetch(`/write?name=${name}&pos=${pos}${first ? '&first=1' : ''}`, { method: 'POST', body }).then((r) => { if (!r.ok) throw new Error(`write ${r.status}`); });
    await post(0, new Uint8Array(0), true);
    const writable = new WritableStream({ write: (c) => post(c.position, c.data) });
    try {
        await buildDevDigest({ data, range, hlsOf, writable, canvas: $('v'), signal: ctrl.signal, onProgress });
        await writable.close().catch(() => {});   // StreamTarget may have closed it
    } catch (e) {
        await writable.abort().catch(() => {});
        throw e;
    }
    await fetch(`/done?name=${name}`, { method: 'POST' });
}

// the whole video in parts of ~30 s: finished parts are skipped, a failed one is tried 3 times, then joined
async function whole(t0) {
    const list = parts(schedule(data, 600)), names = list.map((_, i) => `part-${String(i).padStart(2, '0')}.mp4`);
    const have = new Set(await (await fetch(`/parts?names=${names.join(',')}`)).json());
    const failed = [];
    for (let i = 0; i < list.length; i++) {
        if (have.has(names[i])) continue;
        for (let attempt = 1; ; attempt++) {
            try {
                await piece(names[i], list[i], (p) => say(`Часть ${i + 1} из ${list.length} (готово до неё: ${have.size}), попытка ${attempt}: ` +
                    `${Math.round((p.frame / 30 - list[i][0]) / (list[i][1] - list[i][0]) * 100)}%, прочитано ${p.mb} МБ, ${Math.round((performance.now() - t0) / 1000)} с`));
                have.add(names[i]);
                break;
            } catch (e) {
                if (e.name === 'AbortError') throw e;
                if (attempt >= 3) { failed.push(`${names[i]}: ${e.message}`); break; }
            }
        }
    }
    if (failed.length) { say(`Не собраны ${failed.length} частей — нажмите «Собрать» ещё раз, готовые пропустятся:\n${failed.join('\n')}`); return; }
    say('Все части готовы, склеиваю…');
    const r = await fetch(`/concat?names=${names.join(',')}&out=dev-digest-10min.mp4`, { method: 'POST' });
    say(r.ok ? `Готово за ${Math.round((performance.now() - t0) / 1000)} с: tiktok-clips/out/dev-digest/dev-digest-10min.mp4 (${list.length} частей).` : `Склейка не удалась: ${await r.text()}`);
}

async function run(test) {
    const pick = +$('len').value, range = pick === 600 ? null : pick === 90 ? [0, 90] : [110, 200];
    ctrl = new AbortController();
    $('stop').disabled = false; $('build').disabled = true; $('test').disabled = true;
    const t0 = performance.now();
    const progress = (p) => say(`${p.stage === 'mux' ? 'Дописываю файл…' : 'Кадр'} ${p.frame} / ${p.frames} (${Math.round(p.frame / p.frames * 100)}%), ` +
        `прочитано ${p.mb} МБ, со звуком ${Math.round(p.sound)} с, ${Math.round((performance.now() - t0) / 1000)} с`);
    try {
        if (test) {
            const blob = await buildDevDigest({ data, range, canvas: $('v'), signal: ctrl.signal, onProgress: progress });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob); a.download = 'dev-digest-test.mp4'; a.textContent = 'скачать пробу';
            say(`Готово за ${Math.round((performance.now() - t0) / 1000)} с, ${(blob.size / 1048576).toFixed(1)} МБ. `); $('status').append(a);
            window.__clip = blob;
        } else if (!range) await whole(t0);
        else {
            await piece(`dev-digest-${range[0]}-${range[1]}s.mp4`, range, progress);
            say(`Готово за ${Math.round((performance.now() - t0) / 1000)} с: файл в tiktok-clips/out/dev-digest/.`);
        }
    } catch (e) {
        say(`${e.name === 'AbortError' ? 'Остановлено' : 'Ошибка: ' + e.message}. Готовые части сохранены, «Собрать» продолжит с места остановки.`);
    } finally {
        $('stop').disabled = true; $('build').disabled = !hlsOf; $('test').disabled = false;
    }
}
$('build').onclick = () => run(false);
$('test').onclick = () => run(true);
$('stop').onclick = () => ctrl?.abort();
window.ready = true;
</script></body></html>
