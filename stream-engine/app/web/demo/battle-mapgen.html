<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Крепости — генератор карт</title>
<style>
  /* map generator v4 for docs/games/battle.md: the whole field is a mosaic of tiny hexes (one hex = a soldier's
     head, ~4.8 px). Territories grow from the corners as noisy fronts to 15–20% of the hexes each; the border
     of a territory IS its wall. The middle stays neutral, with holdings to fight over. */
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: #0d0d14; color: #eee; font-family: 'Segoe UI', system-ui, sans-serif; }
  header { display: flex; gap: 10px; align-items: center; padding: 10px 14px; flex-wrap: wrap; }
  header h1 { font-size: 15px; margin: 0 10px 0 0; color: #f4e6c2; }
  button, select { font: 700 12px system-ui; padding: 7px 11px; border-radius: 7px; border: 0; cursor: pointer; background: #2c2c44; color: #eee; }
  button:hover { background: #3a3a5a; }
  #info { font-size: 12px; color: #99a; }
  #maps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 0 14px 14px; }
  figure { margin: 0; }
  figure canvas { width: 100%; aspect-ratio: 9 / 16; display: block; border-radius: 8px; box-shadow: 0 0 0 1px #2a2a3a; cursor: zoom-in; }
  figcaption { font-size: 12px; color: #aab; padding: 4px 2px; }
  #big { position: fixed; inset: 0; background: #000d; display: none; place-items: center; cursor: zoom-out; }
  #big canvas { height: 96vh; aspect-ratio: 9 / 16; border-radius: 10px; }
  @media (max-width: 700px) { #maps { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>
<body>
<header>
  <h1>⚔ Крепости — гекс-генератор</h1>
  <label>Команд <select id="n"><option>2</option><option>3</option><option selected>4</option><option>5</option><option>6</option></select></label>
  <button id="again">🗺 Новые карты</button>
  <span id="info"></span>
</header>
<div id="maps"></div>
<div id="big"></div>
<script src="battle-map.js"></script>
<script>
'use strict';

// ================= page =================
const maps = document.getElementById('maps'), big = document.getElementById('big');
function build() {
  maps.innerHTML = ''; const t0 = performance.now(), n = +document.getElementById('n').value;
  for (let k = 0; k < 4; k++) {
    const f = document.createElement('figure'), cv = document.createElement('canvas'); cv.width = W; cv.height = H;
    const M = genValid(n); render(M, cv);
    const cap = document.createElement('figcaption'); cap.textContent = `№${M.seed % 10000} · куски границ: ${M.pieces.join('/')} · мин. зазор: ${M.minGap} сот · между воротами ≥ ${M.gateGap} · ` + M.got.map(c => Math.round(c / N * 100) + '%').join(' ');
    f.append(cv, cap); maps.append(f);
    cv.onclick = () => { const c = document.createElement('canvas'); c.width = W; c.height = H; c.getContext('2d').drawImage(cv, 0, 0); big.innerHTML = ''; big.append(c); big.style.display = 'grid'; };
  }
  document.getElementById('info').textContent = `4 карты за ${Math.round(performance.now() - t0)} мс · клик по карте — крупно`;
}
big.onclick = () => { big.style.display = 'none'; };
document.getElementById('again').onclick = build;
document.getElementById('n').onchange = build;
build();
</script>
</body>
</html>
