<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Streamer Overlay</title>
<style>
  /* The page TikTok LIVE Studio captures: transparent everywhere. Inside it, centred, an invisible frame in
     the phone's format (9:16 / 9:19.5 / 9:20, from the game's settings) - the overlay itself (frame.html)
     lives in that frame: balloons are born at its bottom edge and fly up through it, planes cross it.
     Opened without ?tt=1 (a preview from the menu) the frame shows a dashed outline to line it up. */
  :root { --fh: 177.78; --u: min(calc(100vw / 100), calc(100vh / var(--fh))); }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
  #frame { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); border: 0;
           width: calc(var(--u) * 100); height: calc(var(--u) * var(--fh)); background: transparent; }
  html.preview #frame { outline: 2px dashed rgba(0, 229, 255, .85); outline-offset: -2px; }
</style>
</head>
<body>
<iframe id="frame" title="overlay" allow="autoplay" allowtransparency="true"></iframe>
<script>
(() => {
  const qs = new URLSearchParams(location.search);
  if (qs.get('tt') !== '1') document.documentElement.classList.add('preview');
  const frame = document.getElementById('frame');
  frame.src = 'streamer/frame.html' + location.search;      // same room (base href), same mode flags
  window.addEventListener('message', e => {                // the overlay tells its frame format
    if (e.source === frame.contentWindow && e.data && e.data.frame) {
      document.documentElement.style.setProperty('--fh', (100 * e.data.frame / 9).toFixed(2));
    }
  });
})();
</script>
</body>
</html>
